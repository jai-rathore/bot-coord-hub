services:
  - type: web
    name: honeymatcha-web
    runtime: node
    plan: starter
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GUEST_TOKEN_PEPPER
        generateValue: true
      - key: PUBLIC_INVITE_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: GOOGLE_CALENDAR_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://honeymatcha.io/api/google/callback
      - key: ALLOW_MOCK_CALENDAR
        value: "false"
      - key: INTENT_ADMIN_EMAILS
        sync: false
      - key: TRIAGE_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
