services:
  - type: web
    name: honeymatcha-web
    runtime: node
    plan: starter
    region: oregon
    rootDir: web
    buildCommand: npm install && npm run build
    preDeployCommand: PREFLIGHT_PRODUCTION=true npm run db:preflight-env && npm run db:migrate && npm run db:seed && PREFLIGHT_PRODUCTION=true npm run db:preflight
    startCommand: npm run start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_EVENTS
        value: "true"
      - key: ENABLE_DISCOVERY
        value: "true"
      - key: ENABLE_CANONICAL_LOCATIONS
        value: "false"
      - key: HOSTED_AGENT_PROVIDER
        value: gemini
      - key: HOSTED_AGENT_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_ORIGIN
        value: https://honeymatcha.io
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GUEST_TOKEN_PEPPER
        generateValue: true
      - key: PUBLIC_INVITE_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: GOOGLE_CALENDAR_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://honeymatcha.io/api/google/callback
      - key: ALLOW_MOCK_CALENDAR
        value: "false"
      - key: INTENT_ADMIN_EMAILS
        sync: false
      - key: TRIAGE_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: honeymatcha-rate-limit
          property: connectionString
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
  - type: keyvalue
    name: honeymatcha-rate-limit
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
  - type: cron
    name: honeymatcha-discovery-cleanup
    runtime: node
    plan: starter
    region: oregon
    rootDir: web
    schedule: "0 * * * *"
    buildCommand: npm install
    startCommand: npm run discovery:cleanup
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
  - type: cron
    name: honeymatcha-events-tick
    runtime: node
    plan: starter
    region: oregon
    rootDir: web
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: npm run events:tick
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_EVENTS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EVENT_EMAIL_FROM
        sync: false
      - key: NEXT_PUBLIC_APP_ORIGIN
        value: https://honeymatcha.io
      - key: GOOGLE_CALENDAR_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
